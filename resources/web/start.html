<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161719">
<title>ShowCom</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #161719; color: #f2f2f3;
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .box { text-align: center; padding: 32px; }
  img { width: 96px; height: 96px; }
  h1 { margin: 12px 0 4px; font-size: 26px; letter-spacing: .5px; }
  h1 b { color: #35d6b4; }
  p { color: #a3a5ab; margin: 0; }
</style>
</head>
<body>
<div class="box">
  <img src="/icon.png" alt="">
  <h1>SHOW<b>COM</b></h1>
  <p id="msg">Verbinde …</p>
</div>
<script>
(async () => {
  const KEY = 'showcom.device';
  const msg = document.getElementById('msg');
  const unknown = location.pathname.match(/^\/d\/([A-Z0-9]+)/);   // Geräte-ID ist am Host nicht (mehr) bekannt
  let id = localStorage.getItem(KEY);

  if (unknown) {
    localStorage.removeItem(KEY);
    id = null;
    msg.textContent = 'Dieses Gerät ist am Host nicht eingerichtet – es wird neu angemeldet …';
  }

  if (id) { location.replace('/d/' + id); return; }

  // Gerätename für den Host: Gerätetyp + Browser (der Host ergänzt den Netzwerknamen, falls er ihn findet)
  async function deviceName() {
    const ua = navigator.userAgent;
    let model = '';
    try {
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        const h = await navigator.userAgentData.getHighEntropyValues(['model', 'platform']);
        model = (h.model || '').trim();   // nur Android liefert hier einen echten Gerätenamen
      }
    } catch (e) {}
    if (!model) {
      model = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad'
            : /iPhone/.test(ua) ? 'iPhone'
            : /Android/.test(ua) ? ((ua.match(/Android[^;]*;\s*([^;)]+?)(?:\sBuild|\))/) || [])[1] || 'Android')
            : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows-PC' : /Linux/.test(ua) ? 'Linux' : 'Gerät';
    }
    const browser = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome'
                  : /Safari\//.test(ua) ? 'Safari' : '';
    return (model + (browser ? ' · ' + browser : '')).slice(0, 40);
  }

  try {
    const r = await fetch('/api/register', { method: 'POST', body: JSON.stringify({ name: await deviceName() }) });
    const j = await r.json();
    localStorage.setItem(KEY, j.id);
    location.replace('/d/' + j.id);
  } catch (e) {
    msg.textContent = 'ShowCom ist gerade nicht erreichbar.';
  }
})();
</script>
</body>
</html>
