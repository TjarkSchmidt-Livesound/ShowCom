<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161719">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ShowCom</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #161719; --panel: #1f2023; --raised: #2a2b2f; --border: #3a3c41;
    --text: #f2f2f3; --dim: #a3a5ab; --faint: #6c6f76;
    --ok: #35d6b4; --alert: #ffb020; --crit: #ff4d6d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  button, input { font: inherit; color: inherit; }

  /* --- Kopf -------------------------------------------------------------- */
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel);
           border-bottom: 1px solid var(--border); flex-wrap: wrap; z-index: 5; flex: 0 0 auto; }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo img { width: 34px; height: 34px; }
  .logo b { font-size: 18px; letter-spacing: .3px; }
  .logo b span { color: var(--ok); }
  .logo small { display: block; color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .5px; }
  .pill { padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .pill.on { background: rgba(53,214,180,.18); color: var(--ok); }
  .pill.off { background: var(--alert); color: var(--bg); }
  .pill.lost { background: var(--crit); color: #fff; }
  .field { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border);
           border-radius: 8px; padding: 0 10px; height: 36px; }
  .field label { color: var(--faint); font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
  .field input { background: transparent; border: 0; outline: 0; width: 150px; font-weight: 700; }
  .spacer { flex: 1; }
  .btn { background: var(--raised); border: 1px solid var(--border); border-radius: 8px; height: 36px;
         padding: 0 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn.active { background: rgba(53,214,180,.18); color: var(--ok); border-color: transparent; }

  /* --- Alarm-Banner ------------------------------------------------------- */
  #banner { display: none; align-items: center; gap: 14px; padding: 12px 18px; background: var(--alert); color: var(--bg);
            cursor: pointer; z-index: 4; flex: 0 0 auto; }
  #banner.show { display: flex; animation: flash .8s steps(1) infinite; }
  #banner img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: rgba(0,0,0,.2); }
  #banner .t { font-weight: 800; font-size: 17px; }
  #banner .q { font-size: 15px; }
  #banner .ack { margin-left: auto; font-weight: 800; font-size: 12px; white-space: nowrap; }
  @keyframes flash { 50% { background: #7a5410; color: var(--alert); } }

  /* --- Board -------------------------------------------------------------- */
  #board { display: flex; gap: 14px; padding: 14px; overflow-x: auto; flex: 1 1 auto; min-height: 0; align-items: stretch; }
  /* Zweite Zeile: Umbruch-Element zwingt die folgenden Kacheln in eine neue Reihe */
  #board.rows { flex-wrap: wrap; overflow: auto; align-content: flex-start; }
  #board.rows .card { height: max(360px, calc((100vh - 110px) / 2 - 14px)); min-height: 0; }
  .rowbreak { flex-basis: 100%; height: 0; }
  #board.rows .card:not(.tb) .photo.cut img { width: auto; height: 118%; }
  #board.rows .comm { min-height: 40px; }
  #board.rows .card.tb .photo { min-height: 90px; }
  /* Mute: dicker roter Rahmen + Hinweis */
  .card.muted::after { content: ""; position: absolute; inset: 0; border: 6px solid var(--crit); border-radius: 16px;
                       z-index: 7; pointer-events: none; }
  .mutepill { display: none; position: absolute; z-index: 5; left: 50%; transform: translateX(-50%); top: 92px;
              background: var(--crit); color: #fff; font-weight: 900; font-size: 15px; letter-spacing: .5px;
              padding: 5px 14px; border-radius: 7px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .card.muted .mutepill { display: block; }
  /* In-Ear (AD PSM) */
  .iem { display: none; margin: 4px 12px; padding: 5px 8px; border-radius: 8px; background: rgba(0,0,0,.28);
         grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; font-size: 11px; font-weight: 800; }
  .iem.on { display: grid; }
  .iem .st { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  .iem .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .iem .nm { color: var(--faint); font-size: 10px; grid-column: 1; }
  .iem .meters { grid-row: 1 / span 2; grid-column: 2; display: grid; gap: 4px; }
  .iem .m { display: grid; grid-template-columns: 10px 1fr; gap: 4px; align-items: center; color: var(--faint); font-size: 9px; }
  .iem .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .iem .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ok) 0%, var(--alert) 75%, var(--crit) 100%);
                background-size: var(--full, 100px) 100%; }
  .tools .brk { flex: 0 0 44px; }
  .tools .brk.on { background: rgba(53,214,180,.25); color: var(--ok); }
  .card .brklabel { display: none; position: absolute; left: 12px; bottom: 70px; z-index: 6; font-size: 11px; font-weight: 800; color: var(--ok); }
  body.editing .card.brkon .brklabel { display: block; }
  .empty { color: var(--dim); margin: 40px auto; text-align: center; max-width: 420px; }
  .card { position: relative; flex: 1 0 200px; max-width: 300px; min-height: 480px;
          border-radius: 16px; overflow: hidden; border: 1.5px solid var(--status, var(--ok)); background: var(--panel);
          display: flex; flex-direction: column; }
  .card.speaking { border-width: 3px; border-color: var(--c); box-shadow: 0 0 22px -4px var(--c); }
  .card::before { content: ""; position: absolute; left: 16px; right: 16px; top: 0; height: 3px; border-radius: 2px;
                  background: var(--status, var(--ok)); z-index: 3; }
  .bgfx { position: absolute; inset: 0; z-index: 0;
          background:
            radial-gradient(circle at 50% var(--glowY, 40%), color-mix(in srgb, var(--c) 55%, transparent) 0, transparent 45%),
            repeating-conic-gradient(from 0deg at 50% var(--glowY, 40%), color-mix(in srgb, var(--c) 18%, transparent) 0deg 4deg, transparent 4deg 16deg),
            linear-gradient(180deg, color-mix(in srgb, var(--c) 60%, #000) 0%, color-mix(in srgb, var(--c) 25%, var(--panel)) 45%, var(--panel) 75%); }
  .head { position: relative; z-index: 2; padding: 12px 14px 0; }
  .num { font-size: 11px; font-weight: 800; opacity: .65; }
  .name { font-size: 26px; font-weight: 800; margin-top: 2px; line-height: 1.1; }
  .sub { font-size: 12px; font-weight: 700; opacity: .75; text-transform: uppercase; }
  .batt { position: absolute; right: 14px; top: 12px; width: 44px; height: 18px; }
  .photo { position: relative; z-index: 1; flex: 1 1 auto; display: flex; align-items: flex-end; justify-content: center; min-height: 120px; }
  .photo img { width: 88%; max-height: 100%; object-fit: contain; object-position: bottom; display: block; }
  .photo .ini { font-size: 90px; font-weight: 800; color: color-mix(in srgb, var(--c) 60%, #fff); align-self: center; }
  .card.tb .photo { flex: 0 0 auto; height: calc((100% - 0px) / 3 - 40px); min-height: 110px; }
  .lower { position: relative; z-index: 2; background: color-mix(in srgb, var(--panel) 96%, transparent);
           display: flex; flex-direction: column; flex: 0 0 auto; }
  .card.tb .lower { flex: 1 1 auto; min-height: 0; }
  .comm { margin: 8px 12px 4px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.22); flex: 1 1 auto;
          overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; min-height: 90px; }
  .comm.alerting { animation: glow 1.1s ease-in-out infinite; border: 2px solid var(--alert); }
  @keyframes glow { 0%,100% { background: rgba(255,176,32,.10); box-shadow: 0 0 0 0 rgba(255,176,32,.0); }
                    50% { background: rgba(255,176,32,.28); box-shadow: 0 0 18px 2px rgba(255,176,32,.45); } }
  .comm .ttl { font-size: 10.5px; font-weight: 800; color: var(--faint); margin-bottom: auto; padding-bottom: 6px; }
  .comm.alerting .ttl { color: var(--alert); }
  .msg { padding: 4px 0 4px 8px; border-left: 3px solid transparent; }
  .msg .m { font-size: 10px; font-weight: 800; color: var(--faint); }
  .msg .x { font-size: 13px; }
  .msg.mention { border-left-color: var(--alert); }
  .msg.mention .m { color: var(--alert); }
  .msg.mention .x { color: #ffd27a; font-weight: 700; }
  .msg.live .x { color: var(--dim); }
  .msg.live .m { color: color-mix(in srgb, var(--c) 70%, #fff); }
  mark { background: transparent; color: var(--alert); font-weight: 800; }
  .badges { height: 30px; display: flex; justify-content: center; align-items: center; }
  .badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 5px; }
  .graph { height: 42px; background: rgba(0,0,0,.35); }   /* halbe Höhe */
  .graph svg { width: 100%; height: 100%; display: block; }
  .foot { padding: 6px 14px 10px; display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; font-weight: 700; }
  .foot .a { font-size: 13px; }
  .foot .b { font-size: 13px; color: var(--dim); text-align: right; }
  .foot .c, .foot .d { font-size: 11px; color: var(--dim); }
  .foot .d { text-align: right; }

  /* --- Freigestellte Profilbilder: Person steht frei vor den Strahlen ------- */
  .photo.cut { overflow: visible; }
  .card:not(.tb) .photo.cut img { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 150%; max-height: none; margin: 0; }
  .photo.cut img { width: 112%; max-width: none; margin: 0 -6%;
                   filter: drop-shadow(0 0 22px color-mix(in srgb, var(--c) 55%, transparent)) drop-shadow(0 6px 10px rgba(0,0,0,.45));
                   -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 100%);
                           mask-image: linear-gradient(180deg, #000 78%, transparent 100%); }
  .card:not(.tb) .photo.cut { margin-top: -34px; }   /* Kopf ragt leicht in den Namensbereich, wie auf dem RF-Board */
  .head { pointer-events: none; }
  .head .name, .head .sub, .head .num { text-shadow: 0 1px 6px rgba(0,0,0,.55); }

  /* --- Dashboard anpassen ------------------------------------------------ */
  #editbar { display: none; align-items: center; gap: 12px; padding: 10px 16px; background: color-mix(in srgb, var(--ok) 16%, var(--panel));
             border-bottom: 1px solid var(--border); flex: 0 0 auto; flex-wrap: wrap; z-index: 4; }
  body.editing #editbar { display: flex; }
  #editbar b { color: var(--ok); }
  #editbar span { color: var(--dim); font-size: 13px; }
  #editbar .btn { margin-left: auto; }
  .tools { display: none; position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; padding: 10px; gap: 8px; justify-content: space-between;
           background: color-mix(in srgb, var(--panel) 97%, transparent); }
  body.editing .tools { display: flex; }
  .tools button { flex: 1; height: 44px; white-space: nowrap; overflow: hidden; padding: 0 4px; border-radius: 10px; border: 1px solid var(--border); background: rgba(22,23,25,.92);
                  font-weight: 800; cursor: pointer; font-size: 15px; }
  .tools .eye { flex: 2; font-size: 13px; }
  .tools button:disabled { opacity: .35; cursor: default; }
  .tools .eye.off { color: var(--faint); }
  .grip { display: none; position: absolute; z-index: 6; bottom: 96px; left: 50%; transform: translateX(-50%); width: 56px; height: 56px;
          border-radius: 50%; background: rgba(22,23,25,.85); border: 1px solid var(--border); color: var(--text);
          align-items: center; justify-content: center; font-size: 26px; cursor: grab; touch-action: none; }
  body.editing .grip { display: flex; }
  body.editing .card { cursor: grab; user-select: none; -webkit-user-select: none; }
  body.editing .card.hiddenp > :not(.tools):not(.grip) { opacity: .28; filter: grayscale(1); }
  body.editing .card.hiddenp { border-style: dashed; border-color: var(--faint); }
  .card.dragging { opacity: .9; z-index: 50; box-shadow: 0 18px 40px rgba(0,0,0,.6); pointer-events: none; }
  .slot { flex: 1 0 200px; max-width: 300px; border: 2px dashed var(--ok); border-radius: 16px; background: rgba(53,214,180,.06); }

  @media (max-width: 700px) {
    body { display: block; height: auto; }
    header { position: sticky; top: 0; }
    #banner { position: sticky; top: 0; }
    #board.rows .card { height: auto; }
    .rowbreak { display: none; }
    #board { flex-direction: column; overflow-x: hidden; }
    .card { max-width: none; height: auto; min-height: 0; flex: 0 0 auto; }
    .card .photo { height: 220px; flex: 0 0 auto; }
    .card.tb .photo { height: 170px; }
    .comm { min-height: 120px; max-height: 260px; }
    .slot { flex: 0 0 auto; max-width: none; }
    .card:not(.tb) .photo.cut { margin-top: -20px; }
    .photo.cut img { width: auto; height: 128%; max-height: none; }
    .card:not(.tb) .photo.cut img { width: auto; height: 125%; }
    .field input { width: 110px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><img src="/icon.png" alt=""><div><b>SHOW<span>COM</span></b><small id="devlabel">TALKBACK LOG</small></div></div>
  <span id="status" class="pill on">Verbinde …</span>
  <div class="field" title="Fällt dieser Name, wird auf diesem Gerät alarmiert. Mehrere Namen mit Komma trennen.">
    <label for="kw">Mein Name</label><input id="kw" placeholder="z. B. Tjark, Tjarki" autocomplete="off">
  </div>
  <div class="spacer"></div>
  <button id="editBtn" class="btn" title="Wer erscheint und in welcher Reihenfolge – nur für dieses Gerät">✎ Dashboard anpassen</button>
</header>
<div id="banner"><img id="bimg" alt=""><div><div class="t" id="bt"></div><div class="q" id="bq"></div></div><div class="ack">TIPPEN = GESEHEN</div></div>
<div id="editbar"><b>Dashboard anpassen</b><span>Kacheln ziehen oder mit ◀ ▶ verschieben · 👁 blendet ein/aus · ↵ = ab hier zweite Zeile · gilt nur für dieses Gerät. Personen anlegen und löschen geht nur am ShowCom-Rechner.</span><button id="doneBtn" class="btn active">Fertig</button></div>
<main id="board"></main>

<script>
'use strict';
const deviceId = location.pathname.split('/')[2];
const api = p => `/api/d/${deviceId}/${p}`;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ACK_KEY = `showcom.ack.${deviceId}`;

let state = null, cards = new Map(), breaks = new Set();
let ackId = Number(localStorage.getItem(ACK_KEY) || 0);
let ackLive = new Set(), alertUser = '', alertKey = '', lastAlertKey = '', kwDirty = 0;

// --- Hilfen ----------------------------------------------------------------
function highlight(text, ranges) {
  if (!ranges || !ranges.length) return esc(text);
  let out = '', pos = 0;
  for (const [s, l] of ranges) { out += esc(text.slice(pos, s)) + '<mark>' + esc(text.slice(s, s + l)) + '</mark>'; pos = s + l; }
  return out + esc(text.slice(pos));
}
function battSvg(p) {
  const known = p >= 0, col = !known ? 'var(--faint)' : p > 35 ? 'var(--ok)' : p > 15 ? 'var(--alert)' : 'var(--crit)';
  const seg = known ? Math.min(5, Math.max(0, Math.ceil(p / 20))) : 0;
  let bars = ''; for (let i = 0; i < seg; i++) bars += `<rect x="${4 + i * 7}" y="4" width="5.5" height="10" rx="1.5" fill="${col}"/>`;
  return `<svg class="batt" viewBox="0 0 44 18"><rect x=".75" y=".75" width="39" height="16.5" rx="4" fill="none" stroke="${col}" stroke-width="1.5"/>` +
         `<rect x="41" y="5.5" width="3" height="7" rx="1" fill="${col}"/>${bars}</svg>`;
}
function lineSvg(h) {
  if (!h || h.length < 2) return '';
  const n = 120, pts = h.slice(-n), step = 100 / (n - 1), x0 = 100 - step * (pts.length - 1);
  return `<polyline points="${pts.map((v, i) => `${(x0 + i * step).toFixed(2)},${(100 - v * .92).toFixed(1)}`).join(' ')}" ` +
         `fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.1" vector-effect="non-scaling-stroke"/>`;
}
function graphSvg(h, col, level) {
  if ((!h || h.length < 2) && level && level.length > 1)
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${lineSvg(level)}</svg>`;
  if (!h || h.length < 2) return '';
  const n = 120, pts = h.slice(-n), step = 100 / (n - 1), x0 = 100 - step * (pts.length - 1);
  const xy = pts.map((v, i) => `${(x0 + i * step).toFixed(2)},${(100 - v * .92).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="g${col.replace(/\W/g,'')}" x1="0" y1="0" x2="0" y2="1">` +
         `<stop offset="0" stop-color="${col}" stop-opacity=".75"/><stop offset="1" stop-color="${col}" stop-opacity=".1"/></linearGradient></defs>` +
         `<polygon points="${x0.toFixed(2)},100 ${xy} 100,100" fill="url(#g${col.replace(/\W/g,'')})"/>` +
         `<polyline points="${xy}" fill="none" stroke="${col}" stroke-width="1.2" vector-effect="non-scaling-stroke"/>` +
         (level ? lineSvg(level) : '') + `</svg>`;
}
const fmtMin = m => m >= 0 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : '';

// --- Vibration bei Alarm (kein Ton) -----------------------------------------
function buzz() { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 250]); }

// --- Einstellungen des Geräts ---------------------------------------------
$('kw').addEventListener('input', () => { kwDirty = Date.now(); });
setInterval(() => {
  if (kwDirty && Date.now() - kwDirty > 600) {
    kwDirty = 0;
    fetch(api('settings'), { method: 'POST', body: JSON.stringify({ keywords: $('kw').value }) }).then(poll);
  }
}, 200);

// --- Dashboard anpassen --------------------------------------------------------
let editing = false, drag = null, layoutBusy = false;

function setEditing(on) {
  editing = on;
  document.body.classList.toggle('editing', on);
  $('editBtn').classList.toggle('active', on);
  if (state) render();
}
$('editBtn').onclick = () => setEditing(!editing);
$('doneBtn').onclick = () => setEditing(false);

async function saveLayout() {
  layoutBusy = true;
  try {
    await fetch(api('layout'), { method: 'POST', body: JSON.stringify({
      order: state.persons.map(p => p.id), hidden: state.persons.filter(p => !p.visible).map(p => p.id), breaks: [...breaks] }) });
  } finally { layoutBusy = false; }
}
// Zeilenumbrüche hängen an der Position, nicht an der Person: beim Verschieben bleibt die zweite Zeile, wo sie ist
function keepBreaks(fn) {
  const pos = state.persons.map((p, i) => breaks.has(p.id) ? i : -1).filter(i => i > 0);
  fn();
  breaks = new Set(pos.map(i => state.persons[i].id));
}
function movePerson(id, delta) {
  const i = state.persons.findIndex(p => p.id === id), j = i + delta;
  if (i < 0 || j < 0 || j >= state.persons.length) return;
  keepBreaks(() => { const [p] = state.persons.splice(i, 1); state.persons.splice(j, 0, p); });
  render(); saveLayout();
}
function toggleBreak(id) {
  if (breaks.has(id)) breaks.delete(id); else if (state.persons.findIndex(p => p.id === id) > 0) breaks.add(id);
  render(); saveLayout();
}
function toggleVisible(id) {
  const p = state.persons.find(x => x.id === id); if (!p) return;
  p.visible = !p.visible; render(); saveLayout();
}

// Ziehen mit Maus, Stift oder Finger
document.addEventListener('pointerdown', e => {
  if (!editing || e.button > 0 || e.target.closest('.tools')) return;
  const card = e.target.closest('.card'); if (!card) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;   // Touch: am Griff ziehen, sonst normal scrollen
  drag = { card, id: card.dataset.id, x0: e.clientX, y0: e.clientY, started: false, pid: e.pointerId };
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.started) {
    if (Math.hypot(dx, dy) < 6) return;
    const r = drag.card.getBoundingClientRect();
    drag.started = true; drag.offX = drag.x0 - r.left; drag.offY = drag.y0 - r.top;
    drag.slot = document.createElement('div'); drag.slot.className = 'slot'; drag.slot.style.minHeight = r.height + 'px';
    drag.card.parentNode.insertBefore(drag.slot, drag.card);
    Object.assign(drag.card.style, { position: 'fixed', width: r.width + 'px', height: r.height + 'px', left: r.left + 'px', top: r.top + 'px' });
    drag.card.classList.add('dragging');
  }
  e.preventDefault();
  drag.card.style.left = (e.clientX - drag.offX) + 'px';
  drag.card.style.top = (e.clientY - drag.offY) + 'px';

  // Platzhalter dorthin, wo der Finger gerade ist
  const board = $('board'), vertical = getComputedStyle(board).flexDirection === 'column';
  const others = [...board.querySelectorAll('.card:not(.dragging)')];
  let before = null;
  if (board.classList.contains('rows') && !vertical) {
    // zweizeilig: nächstgelegene Kachel, davor oder dahinter einsetzen
    let best = null, bd = 1e9;
    for (const o of others) {
      const r = o.getBoundingClientRect(), d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      if (d < bd) { bd = d; best = o; }
    }
    if (best) { const r = best.getBoundingClientRect(); before = e.clientX < r.left + r.width / 2 ? best : best.nextSibling; }
  } else {
    for (const o of others) {
      const r = o.getBoundingClientRect();
      if (vertical ? e.clientY < r.top + r.height / 2 : e.clientX < r.left + r.width / 2) { before = o; break; }
    }
  }
  if (before !== drag.slot.nextSibling && before !== drag.slot) board.insertBefore(drag.slot, before);

  // am Rand automatisch scrollen
  if (!vertical) { const b = board.getBoundingClientRect();
    if (e.clientX < b.left + 40) board.scrollLeft -= 14; else if (e.clientX > b.right - 40) board.scrollLeft += 14; }
  else { if (e.clientY < 80) scrollBy(0, -14); else if (e.clientY > innerHeight - 60) scrollBy(0, 14); }
}, { passive: false });
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.started) return;
  d.card.classList.remove('dragging');
  d.card.removeAttribute('style'); d.card.style.setProperty('--c', d.card._c);
  d.slot.replaceWith(d.card);
  const ids = [...$('board').querySelectorAll('.card')].map(c => c.dataset.id);
  keepBreaks(() => state.persons.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id)));
  render(); saveLayout();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

// --- Alarm ---------------------------------------------------------------------
function acknowledge() {
  const newest = Math.max(0, ...state.entries.filter(e => e.mention).map(e => e.id));
  ackId = Math.max(ackId, newest); localStorage.setItem(ACK_KEY, ackId);
  state.live.filter(l => l.mention).forEach(l => ackLive.add(l.user + ':' + l.utterance));
  alertUser = ''; alertKey = '';
  $('banner').classList.remove('show');
  document.querySelectorAll('.comm.alerting').forEach(c => c.classList.remove('alerting'));
}
$('banner').onclick = acknowledge;

function checkAlert() {
  // offene Erwähnungen: neue Einträge nach der letzten Quittung, oder Live-Text mit Erwähnung
  const pending = [
    ...state.live.filter(l => l.mention && !ackLive.has(l.user + ':' + l.utterance)),
    ...state.entries.filter(e => e.mention && e.id > ackId && !ackLive.has(e.user + ':' + e.utterance)).reverse()
  ];
  if (!pending.length) { if (!alertKey) $('banner').classList.remove('show'); return; }

  const a = pending[0], p = state.persons.find(x => x.id === a.user) || { name: '?', role: '' };
  const key = a.live ? `L${a.user}:${a.utterance}` : `E${a.id}`;
  alertUser = a.user; alertKey = key;
  const kw = (state.device.keywords || '').split(',')[0].trim() || 'Dein Name';
  $('bt').textContent = `${kw.toUpperCase()} ERWÄHNT · ${p.name}${p.role ? ' (' + p.role + ')' : ''} · ${a.time}`;
  $('bq').innerHTML = '„' + highlight(a.text, a.ranges) + '“';
  $('bimg').src = p.avatar || '/icon.png';
  $('bimg').style.background = p.cutout ? `radial-gradient(circle at 50% 35%, ${p.colour}, #1f2023 90%)` : '';
  $('banner').classList.add('show');

  // gleiche Ansage (Live -> Endergebnis) nur einmal piepen
  const soundKey = a.user + ':' + a.utterance;
  if (soundKey !== lastAlertKey) { lastAlertKey = soundKey; buzz(); }
}

// --- Kacheln -------------------------------------------------------------------
function cardFor(p) {
  let c = cards.get(p.id);
  if (c) return c;
  c = document.createElement('section');
  c.className = 'card';
  c.dataset.id = p.id;
  c.innerHTML = `<div class="bgfx"></div><div class="head"></div><div class="photo"></div><div class="lower">` +
                `<div class="comm"></div><div class="iem"></div><div class="badges"></div><div class="graph"></div><div class="foot"></div></div>` +
                `<div class="mutepill"></div><div class="brklabel">↵ NEUE ZEILE</div>` +
                `<div class="grip" aria-hidden="true">✥</div>` +
                `<div class="tools"><button class="left" title="nach vorn">◀</button><button class="eye"></button>` +
                `<button class="brk" title="Ab dieser Kachel eine neue Zeile">↵</button><button class="right" title="nach hinten">▶</button></div>`;
  c.querySelector('.brk').onclick = () => toggleBreak(p.id);
  c.querySelector('.left').onclick = () => movePerson(p.id, -1);
  c.querySelector('.right').onclick = () => movePerson(p.id, 1);
  c.querySelector('.eye').onclick = () => toggleVisible(p.id);
  cards.set(p.id, c);
  return c;
}

function render() {
  if (drag && drag.started) return;   // nicht unter dem Finger umbauen
  const visible = editing ? state.persons : state.persons.filter(p => p.visible);
  const board = $('board');

  if (!visible.length) {
    board.innerHTML = `<div class="empty">${state.persons.length ? 'Alle Personen ausgeblendet – oben rechts unter „Dashboard anpassen“ wieder einblenden.'
                                                                 : 'Am ShowCom-Rechner sind noch keine Personen angelegt.'}</div>`;
    cards.clear();
    return;
  }
  if (board.querySelector('.empty')) board.innerHTML = '';

  // Reihenfolge dieses Geräts (kommt so vom Server), Zeilenumbrüche als eigene Elemente
  const wanted = [];
  visible.forEach((p, i) => {
    if (i > 0 && breaks.has(p.id)) {
      let br = board.querySelector(`.rowbreak[data-for="${p.id}"]`);
      if (!br) { br = document.createElement('div'); br.className = 'rowbreak'; br.dataset.for = p.id; }
      wanted.push(br);
    }
    wanted.push(cardFor(p));
  });
  board.classList.toggle('rows', wanted.some(el => el.classList.contains('rowbreak')));
  wanted.forEach((el, k) => { if (board.children[k] !== el) board.insertBefore(el, board.children[k] || null); });
  [...board.children].forEach(el => { if (!wanted.includes(el)) el.remove(); });

  visible.forEach((p, i) => {
    const c = cardFor(p);
    updateCard(c, p, i);
    c.classList.toggle('brkon', i > 0 && breaks.has(p.id));
    c.querySelector('.brk').classList.toggle('on', i > 0 && breaks.has(p.id));
    c.querySelector('.brk').disabled = i === 0;
    c.classList.toggle('hiddenp', !p.visible);
    const eye = c.querySelector('.eye');
    eye.textContent = p.visible ? '👁 An' : '🚫 Aus';
    eye.classList.toggle('off', !p.visible);
    c.querySelector('.left').disabled = i === 0;
    c.querySelector('.right').disabled = i === visible.length - 1;
  });
}

function updateCard(c, p, index) {
  const rf = p.rf || {}, hasRf = rf.assigned && !rf.disabled && rf.online && rf.known;
  const batt = hasRf && rf.txOn ? rf.battery : -1;
  const txOff = hasRf && !rf.txOn, offline = rf.assigned && !rf.disabled && !rf.online;
  const critical = hasRf && rf.txOn && batt >= 0 && (batt <= 15 || (rf.minutes >= 0 && rf.minutes < 30));
  const weak = hasRf && rf.txOn && rf.signal < .2;
  const warning = !critical && hasRf && rf.txOn && ((batt >= 0 && batt <= 35) || weak);
  const status = critical ? 'var(--crit)' : warning ? 'var(--alert)' : (txOff || offline) ? 'var(--faint)' : 'var(--ok)';
  const statusHex = critical ? '#ff4d6d' : warning ? '#ffb020' : (txOff || offline) ? '#6c6f76' : '#35d6b4';

  c.classList.toggle('tb', p.talkback);

  // Mute: AF/RF am Mikrofon-Sender, RF am In-Ear-Sender
  const iem = p.iem, iemRfOff = !!(iem && iem.online && !iem.rfOn);
  const what = [];
  if (p.afMuted || p.rfMuted) what.push(p.afMuted && p.rfMuted ? 'AF + RF' : p.afMuted ? 'AF' : 'RF');
  if (iemRfOff) what.push('IEM RF');
  c.classList.toggle('muted', what.length > 0);
  const mute = what.length ? 'MUTE  ' + what.join('  ·  ') : '';
  if (c._mute !== mute) { c.querySelector('.mutepill').textContent = mute; c._mute = mute; }

  const iemEl = c.querySelector('.iem');
  iemEl.classList.toggle('on', !!iem);
  if (iem) {
    const col = iem.disabled || !iem.online ? 'var(--faint)' : iem.rfOn ? 'var(--ok)' : 'var(--crit)';
    const txt = iem.disabled ? 'aus' : !iem.online ? 'offline' : iem.rfOn ? 'RF AN' : 'RF AUS';
    const pct = v => v === undefined ? 0 : Math.max(0, Math.min(100, (v + 60) / 60 * 100));
    const html = `<div class="st">IEM <span class="dot" style="background:${col}"></span><span style="color:${col}">${txt}</span></div>` +
                 `<div class="meters"><div class="m">L<div class="bar"><i style="width:${pct(iem.l)}%"></i></div></div>` +
                 `<div class="m">R<div class="bar"><i style="width:${pct(iem.r)}%"></i></div></div></div>` +
                 `<div class="nm">${esc(iem.name || '')}</div>`;
    if (c._iem !== html) { iemEl.innerHTML = html; c._iem = html; }
  }
  c.classList.toggle('speaking', !!p.speaking);
  c.style.setProperty('--c', p.colour); c._c = p.colour;
  c.style.setProperty('--status', status);
  c.style.setProperty('--glowY', p.talkback ? '22%' : '45%');

  const sub = [rf.name, p.role].filter(Boolean).join(' · ');
  const head = `<div class="num">${String(index + 1).padStart(2, '0')}</div><div class="name">${esc(p.name)}</div>` +
               `<div class="sub">${esc(sub)}</div>` + (rf.assigned ? battSvg(batt) : '');
  if (c._head !== head) { c.querySelector('.head').innerHTML = head; c._head = head; }

  const photoKey = (p.avatar || 'ini') + (p.cutout ? ':cut' : '');
  if (c._photo !== photoKey) {
    c.querySelector('.photo').classList.toggle('cut', !!(p.avatar && p.cutout));
    c.querySelector('.photo').innerHTML = p.avatar ? `<img src="${esc(p.avatar)}" alt="">`
      : `<div class="ini">${esc(p.name.split(/[\s-]+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase())}</div>`;
    c._photo = photoKey;
  }

  // Kommunikation (nur Talkback-Personen)
  const comm = c.querySelector('.comm');
  comm.style.display = p.talkback ? '' : 'none';
  if (p.talkback) {
    const mine = state.entries.filter(e => e.user === p.id).slice(-6);
    const live = state.live.find(l => l.user === p.id);
    const alerting = alertUser === p.id;
    let html = `<div class="ttl">${alerting ? '● ALARM – AN DICH' : 'LETZTE ANSAGEN'}</div>`;
    if (!mine.length && !live) html += `<div class="msg"><div class="x" style="color:var(--faint)">Noch nichts gesagt.</div></div>`;
    for (const e of mine)
      html += `<div class="msg${e.mention ? ' mention' : ''}"><div class="m">${esc(e.time)}${e.mention ? ' · ERWÄHNT' : ''}</div>` +
              `<div class="x">${highlight(e.text, e.ranges)}</div></div>`;
    if (live)
      html += `<div class="msg live${live.mention ? ' mention' : ''}"><div class="m">spricht …</div><div class="x">${highlight(live.text, live.ranges)} …</div></div>`;
    if (c._comm !== html) { comm.innerHTML = html; c._comm = html; }
    comm.classList.toggle('alerting', alerting);
  }

  const badge = critical ? ['AKKU KRITISCH', 'var(--crit)', '#fff'] : txOff ? ['SENDER AUS', 'rgba(108,111,118,.6)', 'var(--text)']
              : offline ? ['EMPFÄNGER OFFLINE', 'rgba(108,111,118,.6)', 'var(--text)'] : weak ? ['SCHWACHES SIGNAL', 'var(--alert)', 'var(--bg)']
              : warning ? ['AKKU NIEDRIG', 'var(--alert)', 'var(--bg)'] : p.speaking ? ['SPRICHT', p.colour, 'var(--bg)']
              : rf.disabled ? ['ÜBERWACHUNG AUS', 'rgba(108,111,118,.6)', 'var(--text)'] : null;
  const bhtml = badge ? `<span class="badge" style="background:${badge[1]};color:${badge[2]}">${badge[0]}</span>` : '';
  if (c._badge !== bhtml) { c.querySelector('.badges').innerHTML = bhtml; c._badge = bhtml; }

  const level = p.level || null;   // 0..100 wie der HF-Verlauf
  const showGraph = (rf.assigned && !rf.disabled) || !!level;
  c.querySelector('.graph').innerHTML = showGraph ? graphSvg(rf.history || [], statusHex, level) : '';
  c.querySelector('.graph').style.display = showGraph ? '' : 'none';

  let foot;
  if (rf.assigned && rf.disabled) {
    foot = `<div class="a" style="color:var(--dim)">Funk: Überwachung aus</div><div class="b"></div><div class="c" style="color:var(--faint)">in den Einstellungen deaktiviert</div><div class="d"></div>`;
  } else if (rf.assigned) {
    const level = hasRf && rf.txOn ? (rf.dbm !== undefined ? rf.dbm + ' dBm' : rf.quality !== undefined ? 'RF ' + rf.quality + ' %' : '') : '';
    const parts = [rf.model, batt >= 0 ? batt + '%' : '', hasRf && rf.txOn ? fmtMin(rf.minutes) : '', offline ? 'keine Verbindung' : ''].filter(Boolean);
    foot = `<div class="a">${hasRf && rf.freq ? (rf.freq / 1000).toFixed(3) + ' MHz' : '–'}</div><div class="b">${level}</div>` +
           `<div class="c">${esc(parts.join('  '))}</div><div class="d">${esc(rf.antenna || '')}</div>`;
  } else {
    foot = `<div class="a">${p.talkback ? 'Talkback' : '–'}</div><div class="b"></div><div class="c" style="color:var(--faint)">keine Funkstrecke zugewiesen</div><div class="d"></div>`;
  }
  if (c._foot !== foot) { c.querySelector('.foot').innerHTML = foot; c._foot = foot; }
}

// --- Abfrage ---------------------------------------------------------------------
let polling = false;
async function poll() {
  if (polling || layoutBusy || (drag && drag.started)) return;
  polling = true;
  try {
    const r = await fetch(api('state'), { cache: 'no-store' });
    if (r.status === 404) { localStorage.removeItem('showcom.device'); location.replace('/'); return; }
    state = await r.json();
    if (!editing) breaks = new Set(state.persons.filter(p => p.rowBreak).map(p => p.id));

    $('devlabel').textContent = (state.device.label || 'TALKBACK LOG').toUpperCase();
    if (document.activeElement !== $('kw') && !kwDirty) $('kw').value = state.device.keywords || '';
    $('status').className = 'pill ' + (state.listening ? 'on' : 'off');
    $('status').textContent = state.listening ? '● HÖRT ZU' : '❚❚ PAUSIERT';
    document.title = 'ShowCom · ' + (state.device.label || deviceId);

    // Erster Besuch: alte Erwähnungen nicht nachträglich alarmieren
    if (localStorage.getItem(ACK_KEY) === null) {
      ackId = Math.max(0, ...state.entries.map(e => e.id));
      localStorage.setItem(ACK_KEY, ackId);
    }

    checkAlert();
    render();
  } catch (e) {
    $('status').className = 'pill lost';
    $('status').textContent = 'Verbindung verloren';
  } finally {
    polling = false;
  }
}
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
