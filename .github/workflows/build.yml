name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (ASIO)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASIO SDK laden (Steinberg, GPLv3/proprietär)
        shell: pwsh
        run: |
          $url = "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip"
          Invoke-WebRequest $url -OutFile asiosdk.zip
          $hash = (Get-FileHash asiosdk.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca") { throw "ASIO SDK checksum mismatch: $hash" }
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $hdr = Get-ChildItem -Recurse -Filter iasiodrv.h asiosdk | Where-Object { $_.Directory.Name -eq "common" } | Select-Object -First 1
          if (-not $hdr) { Get-ChildItem -Recurse asiosdk | Select-Object -First 40 | ForEach-Object { Write-Output "::warning::$($_.FullName)" }; throw "iasiodrv.h not found in common/" }
          $dir = $hdr.Directory.Parent.FullName
          Write-Output "ASIO SDK: $dir"
          "ASIO_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Konfigurieren
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DTBS_ASIO_SDK_DIR=$env:ASIO_DIR" -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Bauen
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel -- /p:CL_MPCount=4 /v:minimal *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Fehler anzeigen
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in @("configure.log", "build.log", "build/CMakeFiles/CMakeError.log", "build/CMakeFiles/CMakeConfigureLog.yaml")) {
            if (Test-Path $f) {
              Select-String -Path $f -Pattern "CMake Error|error C\d+|error LNK\d+|fatal error|: error" -Context 0,3 |
                Select-Object -First 25 |
                ForEach-Object { $m = ($_.Line + " | " + ($_.Context.PostContext -join " | ")) -replace "%","%25"; Write-Output "::error title=$f::$m" }
            }
          }

      - name: EXE bereitstellen
        shell: pwsh
        run: Copy-Item "build/ShowCom_artefacts/Release/ShowCom.exe" "ShowCom-Windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ShowCom-Windows
          path: ShowCom-Windows.exe

      - name: Tests
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure *>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path test.log -Pattern "FAIL|Failed|Assertion" | Select-Object -First 20 | ForEach-Object { Write-Output "::warning title=Test::$($_.Line)" }
            exit 1
          }

  macos:
    name: macOS (Apple Silicon, Metal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DGGML_NATIVE=OFF 2>&1 | tee configure.log

      - name: Bauen
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          for f in configure.log build.log; do
            [ -f "$f" ] && grep -E "CMake Error|error:|fatal error" -A2 "$f" | head -40 | while IFS= read -r line; do echo "::error title=$f::${line//%/%25}"; done
          done
          true

      - name: Ad-hoc signieren und DMG erstellen
        run: |
          APP="build/ShowCom_artefacts/Release/ShowCom.app"
          codesign --force --deep -s - "$APP"
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "ShowCom" -srcfolder dmg -ov -format UDZO ShowCom-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ShowCom-macOS
          path: ShowCom-macOS.dmg

      - name: Tests
        continue-on-error: true
        run: |
          set -o pipefail
          if ! ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log; then
            grep -E "FAIL|Failed|Assertion" test.log | head -20 | while IFS= read -r line; do echo "::warning title=Test::$line"; done
            exit 1
          fi

  # Nach jedem erfolgreichen Build auf "main" werden EXE und DMG als GitHub-Release
  # zur Version aus CMakeLists.txt veröffentlicht (z. B. v0.1.0). Neue Builds derselben
  # Version ersetzen die Dateien; für ein neues Release die Version in CMakeLists.txt erhöhen.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        run: |
          VERSION=$(sed -n 's/^project([^ ]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ShowCom ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows:** `ShowCom-Windows.exe` herunterladen und starten. SmartScreen-Warnung: „Weitere Informationen → Trotzdem ausführen“.
            **macOS (Apple Silicon):** `ShowCom-macOS.dmg` öffnen, ShowCom in „Programme“ ziehen. Beim ersten Start Rechtsklick → „Öffnen“.

            Danach in ShowCom unter *Einstellungen* ein Spracherkennungs-Modell herunterladen.
          files: |
            dist/ShowCom-Windows.exe
            dist/ShowCom-macOS.dmg
