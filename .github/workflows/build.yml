name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (ASIO)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASIO SDK laden (Steinberg, GPLv3/proprietär)
        shell: pwsh
        run: |
          $url = "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip"
          Invoke-WebRequest $url -OutFile asiosdk.zip
          $hash = (Get-FileHash asiosdk.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca") { throw "ASIO SDK checksum mismatch: $hash" }
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $dir = (Get-ChildItem -Recurse -Filter iasiodrv.h asiosdk | Select-Object -First 1).Directory.Parent.FullName
          "ASIO_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Konfigurieren
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DTBS_ASIO_SDK_DIR="$env:ASIO_DIR"
          -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: EXE bereitstellen
        shell: pwsh
        run: Copy-Item "build/ShowCom_artefacts/Release/ShowCom.exe" "ShowCom-Windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ShowCom-Windows
          path: ShowCom-Windows.exe

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

  macos:
    name: macOS (Apple Silicon, Metal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DGGML_NATIVE=OFF

      - name: Bauen
        run: cmake --build build --config Release --parallel 4

      - name: Ad-hoc signieren und DMG erstellen
        run: |
          APP="build/ShowCom_artefacts/Release/ShowCom.app"
          codesign --force --deep -s - "$APP"
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "ShowCom" -srcfolder dmg -ov -format UDZO ShowCom-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ShowCom-macOS
          path: ShowCom-macOS.dmg

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

  # Bei einem Tag wie "v0.1.0" werden EXE und DMG als GitHub-Release veröffentlicht.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShowCom-Windows.exe
            dist/ShowCom-macOS.dmg
